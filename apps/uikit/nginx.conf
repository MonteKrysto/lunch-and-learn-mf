server {
  listen 80;
  root /usr/share/nginx/html;

  # Assets must never fall back to index.html: the SPA fallback would answer
  # 304/200-with-HTML for stale or missing chunk URLs (e.g. cached dev-mode
  # chunks after switching from pnpm dev to docker on the same ports).
  location /static/ {
    add_header Access-Control-Allow-Origin *;
    try_files $uri =404;
  }

  location / {
    add_header Access-Control-Allow-Origin *;
    try_files $uri $uri/ /index.html;
  }
}
